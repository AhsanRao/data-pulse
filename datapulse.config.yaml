scraping:
  max_urls: 25
  depth: 1
  concurrency: 4
  timeout_seconds: 60      # increased for JS-heavy SPAs
  same_domain_only: true

playwright:
  scroll_increment_px: 800
  scroll_pause_ms: 1500    # longer pause so SPA can re-render after scroll
  headless: true
  max_scroll_attempts: 60  # enough for 600+ item catalogs
  max_pages: 20            # max pagination clicks with --paginate

llm:
  # Default Ollama model — override with OLLAMA_MODEL= in secrets.env
  local_model: qwen2.5:1.5b

  # Default Anthropic model — override with ANTHROPIC_MODEL= in secrets.env
  # Only used when ANTHROPIC_API_KEY is set and LLM_BASE_URL is not configured.
  selector_model: claude-haiku-4-5-20251001

  # Safety cap: max number of HTML chunks to try before giving up.
  # The loop stops EARLY the moment a valid selector is found — so if the selector
  # is found at chunk 10, chunks 11–50 are never touched.
  # Only exists to prevent runaway LLM calls on unusually large pages (100+ chunks).
  max_chunk_attempts: 50

output:
  default_format: json
  include_metadata: true
