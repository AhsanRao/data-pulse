scraping:
  max_urls: 25
  depth: 1
  concurrency: 4
  timeout_seconds: 60      # increased for JS-heavy SPAs
  same_domain_only: true

playwright:
  scroll_increment_px: 800
  scroll_pause_ms: 1500    # longer pause so SPA can re-render after scroll
  headless: true
  max_scroll_attempts: 60  # enough for 600+ item catalogs
  max_pages: 20            # max pagination clicks with --paginate

llm:
  # Model used when Ollama is the active backend (no LiteLLM/Anthropic configured)
  local_model: qwen2.5:1.5b

  # Model used when Anthropic direct SDK is the active backend (ANTHROPIC_API_KEY set,
  # LiteLLM not configured). Has no effect when using LiteLLM — model comes from LLM_MODEL env var.
  selector_model: claude-haiku-4-5-20251001

output:
  default_format: json
  include_metadata: true
