[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse-agent"
version = "0.1.0"
description = "AI-Driven Intent-Based Web Extraction Agent"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "playwright>=1.44",
    "trafilatura>=1.9",
    "anthropic>=0.28",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
datapulse = "datapulse.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["datapulse*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
